name: SATARK AI CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "ai/**"
      - ".github/workflows/ai-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest -q
      - name: Validate synthetic evaluation data
        run: python training/validate_dataset.py
      - name: Run deterministic smoke evaluation
        run: python training/evaluate.py
