name: SATARK AI CI

on:
  pull_request:
    paths:
      - "ai/**"
      - ".github/workflows/ai-ci.yml"
  push:
    branches: [main]
    paths:
      - "ai/**"
      - ".github/workflows/ai-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest -q
      - name: Validate synthetic evaluation data
        run: python training/validate_dataset.py
      - name: Run deterministic smoke evaluation
        run: python training/evaluate.py
