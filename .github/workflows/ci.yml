name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: satark
          POSTGRES_PASSWORD: satark
          POSTGRES_DB: satark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satark -d satark_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            firstlight-api-requirements.txt

      - name: Show runtime
        run: |
          python --version
          python -m pip --version

      - name: Install PostgreSQL client for backup/restore integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install -r firstlight-api-requirements.txt
          python -m pip install pytest

      - name: Check dependency consistency
        run: python -m pip check

      - name: Validate release gate references current FIRSTLIGHT CI evidence
        shell: bash
        run: |
          set -euo pipefail
          api_workflow=".github/workflows/firstlight-api-ci.yml"
          release_gate=".github/workflows/release-gate.yml"
          web_workflow=".github/workflows/web-ci.yml"
          android_workflow=".github/workflows/android-file-guard.yml"
          production_smoke=".github/workflows/production-smoke.yml"
          grep -Fq 'name: FIRSTLIGHT API CI' "$api_workflow"
          grep -Fq 'name: Android File Guard' "$android_workflow"
          grep -Fq 'name: Install and launch APK on Android emulator' "$android_workflow"
          grep -Fq '"styles.css"' "$android_workflow"
          grep -Fq '".streamlit/config.toml"' "$android_workflow"
          grep -Fq 'tests/test_android_emulator_smoke.py' "$android_workflow"
          grep -Fq 'Test Android emulator foreground-activity recognition' "$android_workflow"
          grep -Fq 'name: FIRSTLIGHT regression, PostgreSQL and container validation' "$api_workflow"
          for trigger_path in \
            ".github/workflows/ci.yml" \
            ".github/workflows/release-gate.yml" \
            "docs/RELEASE_READINESS.md" \
            "docs/FIRSTLIGHT_IMPLEMENTATION_STATUS.md" \
            "web/**" \
            "android/**" \
            "file_guard/**" \
            "scripts/android_emulator_smoke.py" \
            "tests/test_android*.py"; do
            grep -Fq "$trigger_path" "$api_workflow"
          done
          for trigger_path in \
            ".github/workflows/ci.yml" \
            ".github/workflows/firstlight-api-ci.yml" \
            ".github/workflows/release-gate.yml" \
            "docs/RELEASE_READINESS.md" \
            "docs/FIRSTLIGHT_IMPLEMENTATION_STATUS.md" \
            "web/**" \
            "android/**" \
            "file_guard/**" \
            "scripts/android_emulator_smoke.py" \
            "tests/test_android*.py"; do
            grep -Fq "$trigger_path" "$web_workflow"
            grep -Fq "$trigger_path" "$android_workflow"
          done
          for trigger_path in \
            "firstlight_api.py" \
            "satark_backend.py" \
            "integrations/**" \
            "migrations/**"; do
            grep -Fq "$trigger_path" "$android_workflow"
          done
          grep -Fq 'FIRSTLIGHT regression, PostgreSQL and container validation' "$release_gate"
          grep -Fq 'android_run="$(require_run "Android File Guard")"' "$release_gate"
          grep -Fq 'inventory_run="$(require_run "Phase 0 inventory")"' "$release_gate"
          grep -Fq 'production_smoke_run="$(require_run "Production smoke check")"' "$release_gate"
          grep -Fq 'Authenticate a dedicated production smoke account and read tenant data' "$production_smoke"
          grep -Fq 'SATARK_SMOKE_EMAIL' "$production_smoke"
          grep -Fq 'SATARK_SMOKE_PASSWORD' "$production_smoke"
          grep -Fq 'Authenticated production session and tenant readback smoke did not pass.' "$release_gate"
          grep -Fq 'android_device_qa_verified' "$release_gate"
          grep -Fq 'physical Android device QA' "$release_gate"
          grep -Fq 'name: Production smoke check' "$production_smoke"
          grep -Fq 'check_route "/firstlight"' "$production_smoke"
          grep -Fq 'check_unauthenticated_api "/api/cases"' "$production_smoke"
          grep -Fq 'self-hosted SATARK API is not configured' "$production_smoke"
          grep -Fq 'shared rate limiting is not configured' "$production_smoke"
          grep -Fq '.checks.firstlight.investigationProxyConfigured == true and .checks.firstlight.wazuhProxyConfigured == true' "$production_smoke"
          grep -Fq 'tests/test_satark_backend.py' "$api_workflow"
          grep -Fq 'tests/test_satark_postgres.py' "$api_workflow"
          grep -Fq 'def test_workspace_case_and_tenant_isolation' tests/test_satark_backend.py
          grep -Fq 'def test_postgres_signup_tenant_evidence_idempotent_job_and_worker' tests/test_satark_postgres.py
          for step_name in \
            "Run FIRSTLIGHT engine, API, response and worker tests" \
            "Perform isolated PostgreSQL backup and restore drill" \
            "Enforce Supabase-free application runtime" \
            "Enforce Microsoft-free runtime provider boundary" \
            "Validate Wazuh and backup shell scripts" \
            "Validate PostgreSQL role bootstrap shell" \
            "Validate local self-hosted Compose configuration" \
            "Validate production PostgreSQL and TLS Compose stack" \
            "Build API and worker images"; do
            grep -Fq "$step_name" "$api_workflow"
            grep -Fq "$step_name" "$release_gate"
          done

      - name: Compile Python source
        run: |
          python -m compileall -q \
            satark.py ai_provider.py scam_challenge.py video_processing.py reports.py \


      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run FIRSTLIGHT, self-hosted migration, PostgreSQL and engine regression tests
        timeout-minutes: 30
        env:
          SATARK_TEST_POSTGRES_URL: postgresql+psycopg://satark:satark@localhost:5432/satark_test
        run: python -m pytest -vv -o faulthandler_timeout=120 --durations=20 tests/test_satark_migrations.py tests/test_satark_postgres.py tests/test_firstlight_api.py tests/test_firstlight_engine.py tests/test_firstlight_agents.py tests/test_firstlight_wazuh.py tests/test_firstlight_live_wazuh_investigation.py tests/test_firstlight_live_response_cli.py tests/test_firstlight_track1_scenario.py tests/test_firstlight_wazuh_investigation_api.py tests/test_satark_backend.py

      - name: Verify no Supabase runtime dependency remains
        run: python scripts/check_no_supabase_runtime.py

      - name: Install browser test tooling and deterministic video fixture encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Start Streamlit for browser smoke tests
        run: |
          python -m streamlit run satark.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/satark.log 2>&1 &
          echo $! > /tmp/satark.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/satark.log
          exit 1

      - name: Run browser smoke and layout checks
        env:
          SATARK_E2E_URL: http://127.0.0.1:8501
          SATARK_E2E_ARTIFACTS: artifacts
        run: python tests/e2e_smoke.py

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satark-browser-smoke
          path: |
            artifacts/
            /tmp/satark.log
          if-no-files-found: warn

      - name: Stop Streamlit
        if: always()
        run: |
          if [ -f /tmp/satark.pid ]; then kill $(cat /tmp/satark.pid) || true; fi

      - name: Validate UI stylesheet
        run: |
          python -c "from pathlib import Path; css=Path('styles.css').read_text(encoding='utf-8'); assert css.count('{') == css.count('}'), 'Unbalanced CSS braces'; required=['.hero{','.scanner{','.home-grid{','.home-actions{','.sr-only{','.st-key-result_report','.ih-hero{','.ih-capability-grid{','.ih-method{','.ih-method-step{','.st-key-home-actions','@media(max-width:768px)','prefers-reduced-motion:reduce','overflow-x:hidden']; missing=[x for x in required if x not in css]; assert not missing, f'Missing UI selectors: {missing}'"

      - name: Validate required project assets
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              "requirements.txt", "README.md", "CONTRIBUTING.md", "SECURITY.md",
              "styles.css", "satark.py", "config.py", "analysis_engine.py",
              "findings.py", "input_processing.py", "radar_background.py",
              "stepper_component.py", "ai_provider.py", "scam_challenge.py",
              "video_processing.py", "reports.py", "satark_utils.py",
              "url_security.py", "rate_limiter.py", "evidence_engine.py", "firstlight_engine.py",
              "firstlight_ingest.py", "docs/ARCHITECTURE.md", "docs/FIRSTLIGHT.md",
              "docs/UI_DESIGN.md", "docs/RELEASE_READINESS.md",
              "ui/__init__.py", "ui/home.py", "ui/navigation.py", "ui/file_guard.py", "ui/results.py",
              "ui/history.py", "ui/learning.py", "ui/firstlight.py",
              "tests/test_firstlight_engine.py", "tests/test_firstlight_ingest.py",
              "tests/test_url_security.py", "tests/test_input_processing.py", "tests/test_rate_limiter.py",
              "tests/e2e_smoke.py", "file_guard/__init__.py", "file_guard/agents.py", "file_guard/engine.py", "file_guard/intelligence.py", "file_guard/history.py", "file_guard/report.py", "file_guard/structure.py", "tests/test_file_guard.py", "tests/test_file_guard_structure.py", "tests/test_file_guard_reports_and_evaluation.py", "tests/test_android_bridge.py", "android/app/src/main/java/com/satark/mobile/ScanTempFiles.kt", "docs/OFFLINE_FILE_GUARD.md", "scripts/import_ember2024.py", "scripts/download_ember2024.py", "scripts/build_ember2024_android_db.py", "tests/test_ember_import.py", "tests/test_ember_download.py", "tests/test_ember_android_db.py",
          ]
          missing = [
              path for path in files
              if not Path(path).is_file() or Path(path).stat().st_size == 0
          ]
          if missing:
              raise SystemExit(f"Missing or empty project assets: {missing}")
          PY

      - name: Validate Docker Compose environment template
        run: node scripts/check-compose-env-example.mjs

      - name: Validate self-hosted Docker Compose stack
        run: docker compose -f docker-compose.local.yml config --quiet

      - name: Validate optional Nginx rate-limit edge
        run: |
          docker compose -f docker-compose.local.yml --profile edge config --quiet
          docker run --rm -v "$PWD/deploy/nginx/satark.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.28-alpine nginx -t

      - name: Build SATARK and FIRSTLIGHT container images
        run: |
          docker build -f Dockerfile.streamlit -t satark-streamlit:ci .
          docker build -f Dockerfile.firstlight-api -t satark-firstlight-api:ci .
          docker build -f Dockerfile.firstlight-worker -t satark-firstlight-worker:ci .
          docker build -f Dockerfile.firstlight-investigation-worker -t satark-firstlight-investigation-worker:ci .

      - name: Smoke-test imports inside self-hosted container images
        run: |
          docker run --rm --entrypoint python satark-firstlight-api:ci -c "import firstlight_api, satark_backend, firstlight_engine, firstlight_rules, firstlight_agents, ai_provider"
          docker run --rm --entrypoint python satark-firstlight-worker:ci -c "import firstlight_wazuh_worker, firstlight_engine, firstlight_rules"
          docker run --rm --entrypoint python satark-firstlight-investigation-worker:ci -c "import firstlight_investigation_worker, firstlight_engine, firstlight_rules, firstlight_wazuh_worker"

      - name: Check source whitespace and accidental empty lines
        run: |
          python - <<'PY'
          from pathlib import Path
          bad=[]
          for path in Path('.').rglob('*.py'):
              if '.git' in path.parts:
                  continue
              lines=path.read_text(encoding='utf-8').splitlines()
              if any(line.endswith((' ', '\\t')) for line in lines):
                  bad.append(f'{path}: trailing whitespace')
              if '\\n\\n\\n\\n' in path.read_text(encoding='utf-8'):
                  bad.append(f'{path}: 3+ consecutive blank lines')
          if bad:
              raise SystemExit('\\n'.join(bad))
          PY

  web-validation:
    name: Next.js web validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test and build Next.js app
        run: npm run test:ci

  web-browser-acceptance:
    name: Next.js production browser and accessibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Install FFmpeg and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/satark-web.log 2>&1 &
          echo $! > /tmp/satark-web.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/satark-web.log
          exit 1

      - name: Audit production routes, security headers and accessibility
        env:
          SATARK_WEB_URL: http://127.0.0.1:3000
          SATARK_WEB_ARTIFACTS: artifacts/web
        run: npm run test:browser

      - name: Upload browser artifacts and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satark-next-production-browser
          path: |
            web/artifacts/web/
            /tmp/satark-web.log
          if-no-files-found: warn

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/satark-web.pid ]; then kill "$(cat /tmp/satark-web.pid)" || true; fi
