name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show runtime
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install -r firstlight-api-requirements.txt
          python -m pip install pytest

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile Python source
        run: |
          python -m compileall -q \
            satark.py ai_provider.py scam_challenge.py video_processing.py reports.py \
            satark_utils.py url_security.py radar_background.py stepper_component.py evidence_engine.py firstlight_engine.py firstlight_agents.py firstlight_ingest.py config.py input_processing.py analysis_engine.py findings.py rate_limiter.py ui tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run FIRSTLIGHT API and engine regression tests
        run: python -m pytest -q tests/test_firstlight_api.py tests/test_firstlight_engine.py tests/test_firstlight_agents.py tests/test_firstlight_wazuh.py tests/test_firstlight_live_wazuh_investigation.py tests/test_firstlight_live_response_cli.py tests/test_firstlight_track1_scenario.py tests/test_firstlight_wazuh_investigation_api.py

      - name: Install browser test tooling and deterministic video fixture encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Start Streamlit for browser smoke tests
        run: |
          python -m streamlit run satark.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/satark.log 2>&1 &
          echo $! > /tmp/satark.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/satark.log
          exit 1

      - name: Run browser smoke and layout checks
        env:
          SATARK_E2E_URL: http://127.0.0.1:8501
          SATARK_E2E_ARTIFACTS: artifacts
        run: python tests/e2e_smoke.py

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: satark-browser-smoke
          path: |
            artifacts/
            /tmp/satark.log
          if-no-files-found: warn

      - name: Stop Streamlit
        if: always()
        run: |
          if [ -f /tmp/satark.pid ]; then kill $(cat /tmp/satark.pid) || true; fi

      - name: Validate UI stylesheet
        run: |
          python -c "from pathlib import Path; css=Path('styles.css').read_text(encoding='utf-8'); assert css.count('{') == css.count('}'), 'Unbalanced CSS braces'; required=['.hero{','.scanner{','.home-grid{','.home-actions{','.sr-only{','.st-key-result_report','.ih-hero{','.ih-capability-grid{','.ih-method{','.ih-method-step{','.st-key-home-actions','@media(max-width:768px)','prefers-reduced-motion:reduce','overflow-x:hidden']; missing=[x for x in required if x not in css]; assert not missing, f'Missing UI selectors: {missing}'"

      - name: Validate required project assets
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              "requirements.txt", "README.md", "CONTRIBUTING.md", "SECURITY.md",
              "styles.css", "satark.py", "config.py", "analysis_engine.py",
              "findings.py", "input_processing.py", "radar_background.py",
              "stepper_component.py", "ai_provider.py", "scam_challenge.py",
              "video_processing.py", "reports.py", "satark_utils.py",
              "url_security.py", "rate_limiter.py", "evidence_engine.py", "firstlight_engine.py",
              "firstlight_ingest.py", "docs/ARCHITECTURE.md", "docs/FIRSTLIGHT.md",
              "docs/UI_DESIGN.md", "docs/RELEASE_READINESS.md",
              "ui/__init__.py", "ui/home.py", "ui/navigation.py", "ui/results.py",
              "ui/history.py", "ui/learning.py", "ui/demo.py", "ui/firstlight.py",
              "tests/test_firstlight_engine.py", "tests/test_firstlight_ingest.py",
              "tests/test_url_security.py", "tests/test_input_processing.py", "tests/test_rate_limiter.py",
              "tests/e2e_smoke.py",
          ]
          missing = [
              path for path in files
              if not Path(path).is_file() or Path(path).stat().st_size == 0
          ]
          if missing:
              raise SystemExit(f"Missing or empty project assets: {missing}")
          PY

      - name: Validate Docker Compose environment template
        run: node scripts/check-compose-env-example.mjs

      - name: Check source whitespace and accidental empty lines
        run: |
          python - <<'PY'
          from pathlib import Path
          bad=[]
          for path in Path('.').rglob('*.py'):
              if '.git' in path.parts:
                  continue
              lines=path.read_text(encoding='utf-8').splitlines()
              if any(line.endswith((' ', '\\t')) for line in lines):
                  bad.append(f'{path}: trailing whitespace')
              if '\\n\\n\\n\\n' in path.read_text(encoding='utf-8'):
                  bad.append(f'{path}: 3+ consecutive blank lines')
          if bad:
              raise SystemExit('\\n'.join(bad))
          PY

  web-validation:
    name: Next.js web validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify lockfile exists
        run: test -s package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck, test and build Next.js app
        run: npm run test:ci

  web-tenant-integration:
    name: Supabase tenant-isolation integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    env:
      SUPABASE_URL: ${{ secrets.SATARK_TEST_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SATARK_TEST_SUPABASE_PUBLISHABLE_KEY }}
      SATARK_TEST_USER_A_EMAIL: ${{ secrets.SATARK_TEST_USER_A_EMAIL }}
      SATARK_TEST_USER_A_PASSWORD: ${{ secrets.SATARK_TEST_USER_A_PASSWORD }}
      SATARK_TEST_TENANT_A_ID: ${{ secrets.SATARK_TEST_TENANT_A_ID }}
      SATARK_TEST_USER_B_EMAIL: ${{ secrets.SATARK_TEST_USER_B_EMAIL }}
      SATARK_TEST_USER_B_PASSWORD: ${{ secrets.SATARK_TEST_USER_B_PASSWORD }}
      SATARK_TEST_TENANT_B_ID: ${{ secrets.SATARK_TEST_TENANT_B_ID }}
      SATARK_TEST_VIEWER_EMAIL: ${{ secrets.SATARK_TEST_VIEWER_EMAIL }}
      SATARK_TEST_VIEWER_PASSWORD: ${{ secrets.SATARK_TEST_VIEWER_PASSWORD }}
      SATARK_TEST_VIEWER_TENANT_ID: ${{ secrets.SATARK_TEST_VIEWER_TENANT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Check dedicated least-privilege test accounts
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          # Map runtime variable names to actual GitHub Actions secret names.
          declare -A secret_for=(
            [SUPABASE_URL]=SATARK_TEST_SUPABASE_URL
            [SUPABASE_PUBLISHABLE_KEY]=SATARK_TEST_SUPABASE_PUBLISHABLE_KEY
            [SATARK_TEST_USER_A_EMAIL]=SATARK_TEST_USER_A_EMAIL
            [SATARK_TEST_USER_A_PASSWORD]=SATARK_TEST_USER_A_PASSWORD
            [SATARK_TEST_TENANT_A_ID]=SATARK_TEST_TENANT_A_ID
            [SATARK_TEST_USER_B_EMAIL]=SATARK_TEST_USER_B_EMAIL
            [SATARK_TEST_USER_B_PASSWORD]=SATARK_TEST_USER_B_PASSWORD
            [SATARK_TEST_TENANT_B_ID]=SATARK_TEST_TENANT_B_ID
            [SATARK_TEST_VIEWER_EMAIL]=SATARK_TEST_VIEWER_EMAIL
            [SATARK_TEST_VIEWER_PASSWORD]=SATARK_TEST_VIEWER_PASSWORD
            [SATARK_TEST_VIEWER_TENANT_ID]=SATARK_TEST_VIEWER_TENANT_ID
          )
          missing=()
          for key in "${!secret_for[@]}"; do
            if [[ -z "${!key:-}" ]]; then missing+=("${secret_for[$key]}"); fi
          done
          if (( ${#missing[@]} )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            printf '::warning::Tenant-isolation integration is blocked. Add these exact GitHub Actions secrets: %s\\n' "${missing[*]}"
            printf 'BLOCKED — tenant-isolation integration cannot run. Add the exact dedicated test secrets listed here: %s. This required check must fail closed; production release remains blocked.\\n' "${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run real Supabase tenant and role isolation tests
        if: steps.credentials.outputs.configured == 'true'
        run: npm run test:integration

  web-browser-acceptance:
    name: Next.js production browser and accessibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install FFmpeg and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/satark-web.log 2>&1 &
          echo $! > /tmp/satark-web.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/satark-web.log
          exit 1

      - name: Audit production routes, security headers and accessibility
        env:
          SATARK_WEB_URL: http://127.0.0.1:3000
          SATARK_WEB_ARTIFACTS: artifacts/web
        run: npm run test:browser

      - name: Upload browser artifacts and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satark-next-production-browser
          path: |
            web/artifacts/web/
            /tmp/satark-web.log
          if-no-files-found: warn

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/satark-web.pid ]; then kill "$(cat /tmp/satark-web.pid)" || true; fi
