name: SATARK production release gate

on:
  workflow_dispatch:
    inputs:
      production_deployed_sha:
        description: "Exact commit SHA currently deployed to production"
        required: true
        type: string
      self_hosted_schema_verified:
        description: "Self-hosted PostgreSQL schema migration and backup/restore verification passed"
        required: true
        type: boolean
      tenant_isolation_passed:
        description: "Isolated self-hosted PostgreSQL tenant/role integration suite passed (not skipped)"
        required: true
        type: boolean
      windows_linux_telemetry_verified:
        description: "Real authorized Windows and Linux endpoint telemetry was ingested and restart-tested"
        required: true
        type: boolean
      detection_positive_negative_verified:
        description: "At least one real detection positive and negative control passed"
        required: true
        type: boolean
      evidence_integrity_verified:
        description: "Persisted evidence export and hashes independently verified"
        required: true
        type: boolean
      ai_evaluation_passed:
        description: "Grounding/uncertainty evaluation passed against held-out cases"
        required: true
        type: boolean
      real_responder_verified:
        description: "A low-risk authorized lab response was independently verified at the provider"
        required: true
        type: boolean
      android_device_qa_verified:
        description: "The release APK was exercised on a physical Android device, including share intents, folder grants, reboot and scan recovery"
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  release-gate:
    name: Verify release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required CI for this exact commit and reject skipped acceptance jobs
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${WORKFLOW_SHA}&per_page=100")"

          require_run() {
            local workflow="$1"
            local run_id
            run_id="$(jq -r --arg name "$workflow" --arg sha "$WORKFLOW_SHA" '[.workflow_runs[] | select(.name == $name and .head_sha == $sha and .status == "completed" and .conclusion == "success")] | first | .id // empty' <<< "$runs")"
            if [[ -z "$run_id" ]]; then
              echo "::error::No successful completed $workflow run exists for exact release commit $WORKFLOW_SHA."
              exit 1
            fi
            echo "$run_id"
          }

          ci_run="$(require_run "CI")"
          web_run="$(require_run "Web CI")"
          codeql_run="$(require_run "CodeQL")"
          api_run="$(require_run "FIRSTLIGHT API CI")"
          android_run="$(require_run "Android File Guard")"
          inventory_run="$(require_run "Phase 0 inventory")"
          production_smoke_run="$(require_run "Production smoke check")"

          ci_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run}/jobs?per_page=100")"
          ci_job="$(jq -c '[.jobs[] | select(.name == "validate")] | first // empty' <<< "$ci_jobs")"
          if [[ -z "$ci_job" || "$ci_job" == "null" || "$(jq -r '.conclusion' <<< "$ci_job")" != "success" ]]; then
            echo "::error::General CI validation job is missing or did not pass."
            exit 1
          fi
          for step_name in "Run unit tests" "Run FIRSTLIGHT, self-hosted migration, PostgreSQL and engine regression tests" "Run browser smoke and layout checks" "Validate required project assets" "Validate Docker Compose environment template" "Validate self-hosted Docker Compose stack" "Build SATARK and FIRSTLIGHT container images" "Smoke-test imports inside self-hosted container images" "Check source whitespace and accidental empty lines"; do
            step="$(jq -c --arg name "$step_name" '[.steps[] | select(.name == $name)] | first // empty' <<< "$ci_job")"
            if [[ -z "$step" || "$step" == "null" || "$(jq -r '.conclusion' <<< "$step")" != "success" ]]; then
              echo "::error::Required CI step is missing, skipped or failed: $step_name"
              exit 1
            fi
          done

          api_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${api_run}/jobs?per_page=100")"
          api_job="$(jq -c '[.jobs[] | select(.name == "FIRSTLIGHT regression, PostgreSQL and container validation")] | first // empty' <<< "$api_jobs")"
          if [[ -z "$api_job" || "$api_job" == "null" || "$(jq -r '.conclusion' <<< "$api_job")" != "success" ]]; then
            echo "::error::FIRSTLIGHT API/PostgreSQL/container validation job is missing or did not pass."
            exit 1
          fi
          for step_name in "Run FIRSTLIGHT engine, API, response and worker tests" "Perform isolated PostgreSQL backup and restore drill" "Enforce Supabase-free application runtime" "Enforce Microsoft-free runtime provider boundary" "Validate Wazuh and backup shell scripts" "Validate PostgreSQL role bootstrap shell" "Validate local self-hosted Compose configuration" "Validate production PostgreSQL and TLS Compose stack" "Build API and worker images" "Smoke-test API and worker imports"; do
            step="$(jq -c --arg name "$step_name" '[.steps[] | select(.name == $name)] | first // empty' <<< "$api_job")"
            if [[ -z "$step" || "$step" == "null" || "$(jq -r '.conclusion' <<< "$step")" != "success" ]]; then
              echo "::error::Required FIRSTLIGHT API step is missing, skipped or failed: $step_name"
              exit 1
            fi
          done

          android_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${android_run}/jobs?per_page=100")"
          for job_name in "Offline Python engine tests" "Build native Android APK" "Install and launch APK on Android emulator"; do
            job="$(jq -c --arg name "$job_name" '[.jobs[] | select(.name == $name)] | first // empty' <<< "$android_jobs")"
            if [[ -z "$job" || "$job" == "null" || "$(jq -r '.conclusion' <<< "$job")" != "success" ]]; then
              echo "::error::Required Android validation job is missing, skipped or failed: $job_name"
              exit 1
            fi
          done

          web_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${web_run}/jobs?per_page=100")"
          web_job="$(jq -c '[.jobs[] | select(.name == "frontend")] | first // empty' <<< "$web_jobs")"
          if [[ -z "$web_job" || "$web_job" == "null" || "$(jq -r '.conclusion' <<< "$web_job")" != "success" ]]; then
            echo "::error::Web production build/browser validation job is missing or did not pass."
            exit 1
          fi

          codeql_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${codeql_run}/jobs?per_page=100")"
          codeql_job="$(jq -c '[.jobs[] | select(.name == "Analyze Python and JavaScript/TypeScript")] | first // empty' <<< "$codeql_jobs")"
          if [[ -z "$codeql_job" || "$codeql_job" == "null" || "$(jq -r '.conclusion' <<< "$codeql_job")" != "success" ]]; then
            echo "::error::CodeQL analysis job is missing or did not pass."
            exit 1
          fi

          production_smoke_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${production_smoke_run}/jobs?per_page=100")"
          production_smoke_job="$(jq -c '[.jobs[] | select(.name == "smoke")] | first // empty' <<< "$production_smoke_jobs")"
          if [[ -z "$production_smoke_job" || "$production_smoke_job" == "null" || "$(jq -r '.conclusion' <<< "$production_smoke_job")" != "success" ]]; then
            echo "::error::Production smoke job is missing, skipped or failed."
            exit 1
          fi
          auth_smoke_step="$(jq -c '[.steps[] | select(.name == "Authenticate a dedicated production smoke account and read tenant data")] | first // empty' <<< "$production_smoke_job")"
          if [[ -z "$auth_smoke_step" || "$auth_smoke_step" == "null" || "$(jq -r '.conclusion' <<< "$auth_smoke_step")" != "success" ]]; then
            echo "::error::Authenticated production session and tenant readback smoke did not pass."
            exit 1
          fi

          echo "Exact-SHA CI, web, CodeQL, FIRSTLIGHT/PostgreSQL, Android emulator, inventory and authenticated production smoke gates passed for $WORKFLOW_SHA."

      - name: Require exact deployed revision and all evidence gates
        env:
          REQUESTED_SHA: ${{ inputs.production_deployed_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          MIGRATIONS: ${{ inputs.self_hosted_schema_verified }}
          TENANCY: ${{ inputs.tenant_isolation_passed }}
          TELEMETRY: ${{ inputs.windows_linux_telemetry_verified }}
          DETECTION: ${{ inputs.detection_positive_negative_verified }}
          EVIDENCE: ${{ inputs.evidence_integrity_verified }}
          AI_EVAL: ${{ inputs.ai_evaluation_passed }}
          RESPONDER: ${{ inputs.real_responder_verified }}
          ANDROID_QA: ${{ inputs.android_device_qa_verified }}
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          if [[ "${REQUESTED_SHA,,}" != "${WORKFLOW_SHA,,}" ]]; then
            echo "::error::Production SHA does not match the exact commit selected for this release-gate run."
            fail=1
          fi
          for pair in \
            "Self-hosted schema and backup verification:${MIGRATIONS}" \
            "tenant isolation integration tests:${TENANCY}" \
            "real Windows/Linux telemetry:${TELEMETRY}" \
            "detection positive/negative controls:${DETECTION}" \
            "evidence integrity/export verification:${EVIDENCE}" \
            "held-out AI evaluation:${AI_EVAL}" \
            "real provider response verification:${RESPONDER}" \
            "physical Android device QA:${ANDROID_QA}"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [[ "$value" != "true" ]]; then
              echo "::error::Release blocked: ${name} is not verified."
              fail=1
            fi
          done
          if (( fail != 0 )); then
            echo "SATARK is NOT release-ready. Do not infer readiness from build/test success alone."
            exit 1
          fi
          echo "All manually attested release gates are marked verified for ${WORKFLOW_SHA}."
          echo "::warning::This workflow validates supplied attestations and commit identity; it does not independently probe production, self-hosted API/PostgreSQL, endpoint telemetry, AI inference, or responder providers."

      - name: Publish release-gate summary
        if: always()
        env:
          REQUESTED_SHA: ${{ inputs.production_deployed_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          MIGRATIONS: ${{ inputs.self_hosted_schema_verified }}
          TENANCY: ${{ inputs.tenant_isolation_passed }}
          TELEMETRY: ${{ inputs.windows_linux_telemetry_verified }}
          DETECTION: ${{ inputs.detection_positive_negative_verified }}
          EVIDENCE: ${{ inputs.evidence_integrity_verified }}
          AI_EVAL: ${{ inputs.ai_evaluation_passed }}
          RESPONDER: ${{ inputs.real_responder_verified }}
        run: |
          {
            echo "## SATARK production release gate"
            echo
            echo "- Workflow commit: `${WORKFLOW_SHA}`"
            echo "- Claimed production commit: `${REQUESTED_SHA}`"
            echo "- Migration/schema verification: `${MIGRATIONS}`"
            echo "- Tenant isolation: `${TENANCY}`"
            echo "- Real Windows/Linux telemetry: `${TELEMETRY}`"
            echo "- Detection positive/negative controls: `${DETECTION}`"
            echo "- Evidence integrity/export: `${EVIDENCE}`"
            echo "- Held-out AI evaluation: `${AI_EVAL}`"
            echo "- Real provider response: `${RESPONDER}`"
            echo "- Physical Android device QA: `${ANDROID_QA}`"
            echo
            echo "This is an evidence checklist, not an automated proof of external system state."
          } >> "$GITHUB_STEP_SUMMARY"
