name: SATARK production release gate

on:
  workflow_dispatch:
    inputs:
      production_deployed_sha:
        description: "Exact commit SHA currently deployed to production"
        required: true
        type: string
      self_hosted_schema_verified:
        description: "Self-hosted PostgreSQL schema migration and backup/restore verification passed"
        required: true
        type: boolean
      tenant_isolation_passed:
        description: "Isolated self-hosted PostgreSQL tenant/role integration suite passed (not skipped)"
        required: true
        type: boolean
      windows_linux_telemetry_verified:
        description: "Real authorized Windows and Linux endpoint telemetry was ingested and restart-tested"
        required: true
        type: boolean
      detection_positive_negative_verified:
        description: "At least one real detection positive and negative control passed"
        required: true
        type: boolean
      evidence_integrity_verified:
        description: "Persisted evidence export and hashes independently verified"
        required: true
        type: boolean
      ai_evaluation_passed:
        description: "Grounding/uncertainty evaluation passed against held-out cases"
        required: true
        type: boolean
      real_responder_verified:
        description: "A low-risk authorized lab response was independently verified at the provider"
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  release-gate:
    name: Verify release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required CI for this exact commit and reject skipped tenant tests
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${WORKFLOW_SHA}&per_page=100")"
          for workflow in "CI" "Web CI" "CodeQL" "FIRSTLIGHT API CI"; do
            run_id="$(jq -r --arg name "$workflow" --arg sha "$WORKFLOW_SHA" '[.workflow_runs[] | select(.name == $name and .head_sha == $sha and .status == "completed" and .conclusion == "success")] | first | .id // empty' <<< "$runs")"
            if [[ -z "$run_id" ]]; then
              echo "::error::No successful completed $workflow run exists for exact release commit $WORKFLOW_SHA."
              exit 1
            fi
            echo "Verified successful $workflow run $run_id for $WORKFLOW_SHA"
          done
          ci_run="$(jq -r --arg sha "$WORKFLOW_SHA" '[.workflow_runs[] | select(.name == "CI" and .head_sha == $sha and .status == "completed" and .conclusion == "success")] | first | .id // empty' <<< "$runs")"
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run}/jobs?per_page=100")"
          tenant_job="$(jq -c '[.jobs[] | select(.name == "Self-hosted SATARK auth and tenant-isolation integration")] | first // empty' <<< "$jobs")"
          if [[ -z "$tenant_job" || "$tenant_job" == "null" || "$(jq -r '.conclusion' <<< "$tenant_job")" != "success" ]]; then
            echo "::error::Tenant-isolation job is missing or did not pass."
            exit 1
          fi
          test_step="$(jq -c '[.steps[] | select(.name == "Run SQLite identity, tenant isolation, and persistence tests")] | first // empty' <<< "$tenant_job")"
          if [[ -z "$test_step" || "$test_step" == "null" || "$(jq -r '.conclusion' <<< "$test_step")" != "success" ]]; then
            echo "::error::Real self-hosted tenant-isolation tests were skipped, absent, or failed. A green job with a skipped step is not sufficient."
            exit 1
          fi
          echo "Real tenant-isolation test step passed on the exact release commit."
      - name: Require exact deployed revision and all evidence gates
        env:
          REQUESTED_SHA: ${{ inputs.production_deployed_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          MIGRATIONS: ${{ inputs.self_hosted_schema_verified }}
          TENANCY: ${{ inputs.tenant_isolation_passed }}
          TELEMETRY: ${{ inputs.windows_linux_telemetry_verified }}
          DETECTION: ${{ inputs.detection_positive_negative_verified }}
          EVIDENCE: ${{ inputs.evidence_integrity_verified }}
          AI_EVAL: ${{ inputs.ai_evaluation_passed }}
          RESPONDER: ${{ inputs.real_responder_verified }}
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          if [[ "${REQUESTED_SHA,,}" != "${WORKFLOW_SHA,,}" ]]; then
            echo "::error::Production SHA does not match the exact commit selected for this release-gate run."
            fail=1
          fi
          for pair in \
            "Self-hosted schema and backup verification:${MIGRATIONS}" \
            "tenant isolation integration tests:${TENANCY}" \
            "real Windows/Linux telemetry:${TELEMETRY}" \
            "detection positive/negative controls:${DETECTION}" \
            "evidence integrity/export verification:${EVIDENCE}" \
            "held-out AI evaluation:${AI_EVAL}" \
            "real provider response verification:${RESPONDER}"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [[ "$value" != "true" ]]; then
              echo "::error::Release blocked: ${name} is not verified."
              fail=1
            fi
          done
          if (( fail != 0 )); then
            echo "SATARK is NOT release-ready. Do not infer readiness from build/test success alone."
            exit 1
          fi
          echo "All manually attested release gates are marked verified for ${WORKFLOW_SHA}."
          echo "::warning::This workflow validates supplied attestations and commit identity; it does not independently probe production, self-hosted API/PostgreSQL, endpoint telemetry, AI inference, or responder providers."

      - name: Publish release-gate summary
        if: always()
        env:
          REQUESTED_SHA: ${{ inputs.production_deployed_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          MIGRATIONS: ${{ inputs.self_hosted_schema_verified }}
          TENANCY: ${{ inputs.tenant_isolation_passed }}
          TELEMETRY: ${{ inputs.windows_linux_telemetry_verified }}
          DETECTION: ${{ inputs.detection_positive_negative_verified }}
          EVIDENCE: ${{ inputs.evidence_integrity_verified }}
          AI_EVAL: ${{ inputs.ai_evaluation_passed }}
          RESPONDER: ${{ inputs.real_responder_verified }}
        run: |
          {
            echo "## SATARK production release gate"
            echo
            echo "- Workflow commit: `${WORKFLOW_SHA}`"
            echo "- Claimed production commit: `${REQUESTED_SHA}`"
            echo "- Migration/schema verification: `${MIGRATIONS}`"
            echo "- Tenant isolation: `${TENANCY}`"
            echo "- Real Windows/Linux telemetry: `${TELEMETRY}`"
            echo "- Detection positive/negative controls: `${DETECTION}`"
            echo "- Evidence integrity/export: `${EVIDENCE}`"
            echo "- Held-out AI evaluation: `${AI_EVAL}`"
            echo "- Real provider response: `${RESPONDER}`"
            echo
            echo "This is an evidence checklist, not an automated proof of external system state."
          } >> "$GITHUB_STEP_SUMMARY"
