name: Web CI

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: FIRSTLIGHT CSV regression tests
        run: npm test

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Install browser smoke-test tooling
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/satark-web.log 2>&1 &
          echo $! > /tmp/satark-web.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/satark-web.log
          exit 1

      - name: Test desktop/mobile routes and API validation
        env:
          SATARK_WEB_URL: http://127.0.0.1:3000
          SATARK_WEB_ARTIFACTS: artifacts/web
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node tests/browser-smoke.mjs

      - name: Upload frontend browser artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: satark-web-browser-smoke
          path: |
            web/artifacts/web/
            /tmp/satark-web.log
          if-no-files-found: warn

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/satark-web.pid ]; then kill $(cat /tmp/satark-web.pid) || true; fi
