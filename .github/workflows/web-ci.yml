name: Web CI

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate missing lockfile (temporary bootstrap)
        if: github.ref == 'refs/heads/hardening/satark-release-gates-2026-10'
        run: |
          if [ -f package-lock.json ]; then exit 0; fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add reproducible frontend dependency lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: FIRSTLIGHT CSV regression tests
        run: npm test

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Install browser smoke-test tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/satark-web.log 2>&1 &
          echo $! > /tmp/satark-web.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/satark-web.log
          exit 1

      - name: Test desktop/mobile routes and API validation
        env:
          SATARK_WEB_URL: http://127.0.0.1:3000
          SATARK_WEB_ARTIFACTS: artifacts/web
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node tests/browser-smoke.mjs

      - name: Upload frontend browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satark-web-browser-smoke
          path: |
            web/artifacts/web/
            /tmp/satark-web.log
          if-no-files-found: warn

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/satark-web.pid ]; then kill $(cat /tmp/satark-web.pid) || true; fi
