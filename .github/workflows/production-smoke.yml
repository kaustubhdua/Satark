name: Production smoke check

on:
  # Check after Vercel reports a production deployment, not immediately on push:
  # the production alias can still serve the previous commit during deployment.
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
  deployment_status:
  pull_request:
    paths:
      - ".github/workflows/production-smoke.yml"
      - "web/src/app/page.tsx"

permissions:
  contents: read

concurrency:
  group: satark-production-smoke-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Validate production smoke marker against homepage source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "Spot the signal. Preserve the evidence. Own the response." web/src/app/page.tsx
          grep -Fq 'check_route "/" "Spot the signal\. Preserve the evidence\. Own the response\."' .github/workflows/production-smoke.yml
          grep -Fq 'Checking your secure session' web/src/app/firstlight/page.tsx
          grep -Fq 'check_route "/firstlight" "Checking your secure session"' .github/workflows/production-smoke.yml
          grep -Fq 'SATARK_VERCEL_PROTECTION_BYPASS' .github/workflows/production-smoke.yml
          grep -Fq '.checks.firstlight.investigationProxyConfigured == true and .checks.firstlight.wazuhProxyConfigured == true' .github/workflows/production-smoke.yml
          grep -Fq 'x-vercel-protection-bypass' .github/workflows/production-smoke.yml
          grep -Fq 'satark-rose.vercel.app|satark-jyc-website.vercel.app' .github/workflows/production-smoke.yml
          grep -Fq 'curl "${protection_args[@]}"' .github/workflows/production-smoke.yml

  smoke:
    if: github.event_name != 'pull_request' && (github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Verified Vercel production alias; repository variable can override it after a domain change.
      SATARK_PRODUCTION_URL: ${{ vars.SATARK_PRODUCTION_URL || 'https://satark-rose.vercel.app' }}
      # Optional Vercel deployment-protection bypass scoped to this smoke workflow.
      # Never disable SSO globally; leave empty when using a public custom domain.
      SATARK_VERCEL_PROTECTION_BYPASS: ${{ secrets.SATARK_VERCEL_PROTECTION_BYPASS }}
    steps:
      - name: Check out current production branch revision
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check public production routes and security headers
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SATARK_PRODUCTION_URL:-}" ]]; then
            echo "::error::Set the repository Actions variable SATARK_PRODUCTION_URL if the verified production domain changes."
            exit 1
          fi
          expected_sha="$(git rev-parse HEAD)"
          base="${SATARK_PRODUCTION_URL%/}"
          body="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$body" "$headers"' EXIT

          # Vercel can protect every *.vercel.app alias with SSO. When the owner
          # configures a scoped bypass secret, send it only to the target smoke URL.
          # This does not disable project-wide protection or expose the secret in output.
          protection_args=()
          if [[ -n "${SATARK_VERCEL_PROTECTION_BYPASS:-}" ]]; then
            target_host="$(python -c 'import sys; from urllib.parse import urlsplit; print((urlsplit(sys.argv[1]).hostname or "").lower())' "$base")"
            # Never forward the secret to an arbitrary SATARK_PRODUCTION_URL override.
            case "$target_host" in
              satark-rose.vercel.app|satark-jyc-website.vercel.app) ;;
              *)
                echo "::error::The Vercel protection bypass secret may only be sent to the verified SATARK Vercel aliases."
                exit 1
                ;;
            esac
            protection_args+=(--header "x-vercel-protection-bypass: ${SATARK_VERCEL_PROTECTION_BYPASS}")
          fi

          check_route() {
            local route="$1"
            local marker="$2"
            local status
            status="$(curl "${protection_args[@]}" --silent --show-error --location --max-time 20 --output "$body" --dump-header "$headers" --write-out '%{http_code}' "$base$route")"
            if [[ "$status" != "200" ]]; then
              echo "::error::Production route $route returned HTTP $status (expected 200)."
              exit 1
            fi
            if ! grep -Eiq "$marker" "$body"; then
              echo "::error::Production route $route did not contain its expected content marker."
              exit 1
            fi
            for header in content-security-policy strict-transport-security x-content-type-options x-frame-options referrer-policy; do
              if ! grep -Eiq "^$header:" "$headers"; then
                echo "::error::Production route $route is missing security header $header."
                exit 1
              fi
            done
            echo "PASS $route: HTTP 200, expected content and baseline security headers."
          }

          # Regression guard: keep the production marker tied to the source hero heading.
          if ! grep -Fq "Spot the signal. Preserve the evidence. Own the response." web/src/app/page.tsx; then
            echo "::error::Homepage hero changed; update the production smoke marker and this contract check together."
            exit 1
          fi

          # Match route-specific body content rather than navigation labels shared by every page.
          check_route "/" "Spot the signal\. Preserve the evidence\. Own the response\."
          check_route "/investigate" "Suspicious URL or message"
          # FIRSTLIGHT is a client-authenticated route; SSR renders the secure-session status before browser auth redirects.
          check_route "/firstlight" "Checking your secure session"
          check_route "/reports" "Review notes"
          check_route "/learn" "Check answers"
          check_route "/login" "Sign in securely"


          # Authenticated persistence APIs must be deployed, configured, and fail closed without a session.
          check_unauthenticated_api() {
            local route="$1"
            local status
            status="$(curl "${protection_args[@]}" --silent --show-error --max-time 20 --output "$body" --dump-header "$headers" --write-out '%{http_code}' "$base$route")"
            if [[ "$status" != "401" ]]; then
              echo "::error::Unauthenticated $route returned HTTP $status (expected 401)."
              exit 1
            fi
            if ! grep -Eiq '^cache-control:.*no-store' "$headers"; then
              echo "::error::$route must set Cache-Control: no-store."
              exit 1
            fi
            echo "PASS $route: unauthenticated request rejected with 401 and no-store."
          }

          check_unauthenticated_api "/api/cases"
          check_unauthenticated_api "/api/findings"
          check_unauthenticated_api "/api/reports"

          api_status="$(curl "${protection_args[@]}" --silent --show-error --max-time 20 --output "$body" --dump-header "$headers" --write-out '%{http_code}' "$base/api/analyze")"
          if [[ "$api_status" != "405" ]]; then
            echo "::error::GET /api/analyze returned HTTP $api_status (expected 405)."
            exit 1
          fi
          if ! grep -Eiq '^cache-control:.*no-store' "$headers"; then
            echo "::error::GET /api/analyze must set Cache-Control: no-store."
            exit 1
          fi
          echo "PASS /api/analyze: unsupported GET rejected with 405 and no-store."

          # Health is a public-safe configuration snapshot, not a claim of live dependency readiness.
          health_status="$(curl "${protection_args[@]}" --silent --show-error --max-time 20 --output "$body" --write-out '%{http_code}' "$base/api/health")"
          if [[ "$health_status" != "200" ]]; then
            echo "::error::Production /api/health returned HTTP $health_status (expected 200)."
            exit 1
          fi
          jq -e '.status == "configuration-only" and (.checks.rateLimit.configured | type == "boolean") and (.checks.rateLimit.sharedAcrossInstances | type == "boolean") and (has("UPSTASH_REDIS_REST_TOKEN") | not)' "$body" >/dev/null
          if ! jq -e '.checks.persistentStorage.provider == "self-hosted" and .checks.persistentStorage.configured == true and .checks.persistentStorage.clientConfigured == false' "$body" >/dev/null; then
            echo "::error::Production self-hosted SATARK API is not configured; set SATARK_API_INTERNAL_URL to the private FastAPI service."
            exit 1
          fi
          rate_mode="$(jq -r '.checks.rateLimit.mode // empty' "$body")"
          shared_limiter_ok="$(jq -r '.checks.rateLimit.sharedAcrossInstances // false' "$body")"
          echo "Production health: rate limiter mode=$rate_mode sharedAcrossInstances=$shared_limiter_ok."

          version_status="$(curl "${protection_args[@]}" --silent --show-error --max-time 20 --output "$body" --write-out '%{http_code}' "$base/api/version")"
          if [[ "$version_status" != "200" ]]; then
            echo "::error::Production /api/version returned HTTP $version_status; the deployed build revision cannot be verified."
            exit 1
          fi
          deployed_sha="$(jq -r '.commit // empty' "$body")"
          if [[ "$deployed_sha" != "$expected_sha" ]]; then
            echo "::error::Production is serving commit $deployed_sha, but current main is $expected_sha. Deployment is stale."
            exit 1
          fi
          echo "PASS /api/version: production serves current main commit $expected_sha."

          if ! jq -e '.checks.firstlight.investigationProxyConfigured == true and .checks.firstlight.wazuhProxyConfigured == true' "$body" >/dev/null; then
            echo "::error::Production FIRSTLIGHT proxies are not configured with a safe backend URL and strong server-side tokens."
            exit 1
          fi
          echo "PASS /api/health: FIRSTLIGHT investigation and Wazuh proxy configuration is present."

          # Exercise a harmless synthetic input. A missing shared limiter must fail closed,
          # but it is still a release blocker because the primary analysis feature is unavailable.
          analysis_status="$(curl "${protection_args[@]}" --silent --show-error --max-time 20 --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
            -X POST "$base/api/analyze" -H 'Content-Type: application/json' \
            --data '{"input":"Synthetic release smoke test: an ordinary internal status update."}')"
          if [[ "$rate_mode" == "shared-upstash" && "$shared_limiter_ok" == "true" ]]; then
            if [[ "$analysis_status" != "200" ]]; then
              echo "::error::Configured shared limiter did not allow the synthetic analysis smoke test (HTTP $analysis_status)."
              exit 1
            fi
            jq -e 'has("threat_category") and has("summary") and has("notice") and (.summary | length > 0)' "$body" >/dev/null
            echo "PASS /api/analyze: synthetic request returned a structured local analysis result."
          else
            if [[ "$analysis_status" != "503" ]]; then
              echo "::error::Analysis must fail closed when shared rate limiting is absent; received HTTP $analysis_status."
              exit 1
            fi
            if ! grep -Eiq '^retry-after:' "$headers"; then
              echo "::error::Fail-closed /api/analyze response must include Retry-After."
              exit 1
            fi
            echo "::error::Production release is degraded: shared rate limiting is not configured (mode=$rate_mode); analysis correctly fails closed with 503."
            exit 1
          fi



      - name: Authenticate a dedicated production smoke account and read tenant data
        env:
          SATARK_SMOKE_EMAIL: ${{ secrets.SATARK_SMOKE_EMAIL }}
          SATARK_SMOKE_PASSWORD: ${{ secrets.SATARK_SMOKE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SATARK_SMOKE_EMAIL:-}" || -z "${SATARK_SMOKE_PASSWORD:-}" ]]; then
            echo "::error::Authenticated production smoke requires the dedicated SATARK_SMOKE_EMAIL and SATARK_SMOKE_PASSWORD secrets."
            exit 1
          fi
          base="${SATARK_PRODUCTION_URL%/}"
          protection_args=()
          if [[ -n "${SATARK_VERCEL_PROTECTION_BYPASS:-}" ]]; then
            target_host="$(python -c 'import sys; from urllib.parse import urlsplit; print((urlsplit(sys.argv[1]).hostname or "").lower())' "$base")"
            case "$target_host" in
              satark-rose.vercel.app|satark-jyc-website.vercel.app) ;;
              *)
                echo "::error::The Vercel protection bypass secret may only be sent to the verified SATARK Vercel aliases."
                exit 1
                ;;
            esac
            protection_args+=(--header "x-vercel-protection-bypass: ${SATARK_VERCEL_PROTECTION_BYPASS}")
          fi
          jar="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$jar" "$body"' EXIT

          login_payload="$(jq -n --arg email "$SATARK_SMOKE_EMAIL" --arg password "$SATARK_SMOKE_PASSWORD" '{email:$email,password:$password}')"
          login_status="$(curl "${protection_args[@]}" --silent --show-error --max-time 20 --output "$body" --cookie-jar "$jar" --cookie "$jar" --write-out '%{http_code}' -H 'Content-Type: application/json' --data "$login_payload" -H "Origin: $base" "$base/api/auth/login")"
          if [[ "$login_status" != "200" ]]; then
            echo "::error::Dedicated production smoke account authentication failed with HTTP $login_status."
            exit 1
          fi

          session_status="$(curl "${protection_args[@]}" --silent --show-error --max-time 20 --output "$body" --cookie "$jar" --write-out '%{http_code}' "$base/api/auth/session")"
          if [[ "$session_status" != "200" ]] || ! jq -e '(.user.id | type) == "string" and (.user.id | length) > 0' "$body" >/dev/null; then
            echo "::error::Authenticated production session could not be verified."
            exit 1
          fi

          workspaces_status="$(curl "${protection_args[@]}" --silent --show-error --max-time 20 --output "$body" --cookie "$jar" --write-out '%{http_code}' "$base/api/workspaces")"
          if [[ "$workspaces_status" != "200" ]] || ! jq -e '(.workspaces | type) == "array" and (.workspaces | length) > 0' "$body" >/dev/null; then
            echo "::error::Authenticated production account has no readable test workspace."
            exit 1
          fi
          tenant_id="$(jq -r '.workspaces[0].id // empty' "$body")"
          if [[ -z "$tenant_id" ]]; then
            echo "::error::Authenticated production workspace did not return an ID."
            exit 1
          fi

          for spec in "cases|/api/cases?tenant_id=$tenant_id" "findings|/api/findings?tenant_id=$tenant_id" "reports|/api/reports?tenant_id=$tenant_id"; do
            key="${spec%%|*}"
            route="${spec#*|}"
            status="$(curl "${protection_args[@]}" --silent --show-error --max-time 20 --output "$body" --cookie "$jar" --write-out '%{http_code}' "$base$route")"
            if [[ "$status" != "200" ]] || ! jq -e --arg key "$key" '(.[$key] | type) == "array"' "$body" >/dev/null; then
              echo "::error::Authenticated production read failed or returned an invalid $key payload (HTTP $status)."
              exit 1
            fi
          done

          logout_status="$(curl "${protection_args[@]}" --silent --show-error --max-time 20 --output "$body" --cookie "$jar" --cookie-jar "$jar" --write-out '%{http_code}' -H "Origin: $base" -X POST "$base/api/auth/logout")"
          if [[ "$logout_status" != "200" ]]; then
            echo "::error::Production smoke account logout failed with HTTP $logout_status."
            exit 1
          fi
          echo "PASS authenticated production smoke: session, workspace, cases, findings, reports and logout."
