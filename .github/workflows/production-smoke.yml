name: Production smoke check

on:
  # Check after Vercel reports a production deployment, not immediately on push:
  # the production alias can still serve the previous commit during deployment.
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
  deployment_status:

permissions:
  contents: read

concurrency:
  group: satark-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SATARK_PRODUCTION_URL: https://satark-qzym.vercel.app
    steps:
      - name: Check out current production branch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Check public production routes and security headers
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          base="${SATARK_PRODUCTION_URL%/}"
          body="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$body" "$headers"' EXIT
          failures=0

          record_failure() {
            echo "::error::$1"
            failures=$((failures + 1))
          }

          check_route() {
            local route="$1"
            local marker="$2"
            local status
            if ! status="$(curl --silent --show-error --max-time 20 --output "$body" --dump-header "$headers" --write-out '%{http_code}' "$base$route")"; then
              record_failure "Production route $route request failed."
              return 0
            fi
            if [[ "$status" != "200" ]]; then
              record_failure "Production route $route returned HTTP $status (expected 200)."
              return 0
            fi
            if ! grep -Eiq "$marker" "$body"; then
              record_failure "Production route $route did not contain its expected content marker."
            fi
            local missing_headers=0
            for header in content-security-policy strict-transport-security x-content-type-options x-frame-options referrer-policy; do
              if ! grep -Eiq "^$header:" "$headers"; then
                record_failure "Production route $route is missing security header $header."
                missing_headers=1
              fi
            done
            if [[ "$missing_headers" == "0" ]]; then
              echo "PASS $route: HTTP 200, expected content and baseline security headers."
            fi
          }

          # Match route-specific body content rather than navigation labels shared by every page.
          check_route "/" "Pause the panic|Find the signal"
          check_route "/investigate" "Suspicious URL or message"
          check_route "/firstlight" "Launch training case"
          check_route "/reports" "Review notes"
          check_route "/learn" "Check answers"
          check_route "/login" "Sign in securely"
          check_route "/tools" "Every tool, with its real status"
          check_route "/qr" "Decode first. Verify before you visit"

          # Authenticated persistence APIs must be deployed, configured, and fail closed without a session.
          check_unauthenticated_api() {
            local route="$1"
            local status
            if ! status="$(curl --silent --show-error --max-time 20 --output "$body" --dump-header "$headers" --write-out '%{http_code}' "$base$route")"; then
              record_failure "Unauthenticated $route request failed."
              return 0
            fi
            if [[ "$status" != "401" ]]; then
              record_failure "Unauthenticated $route returned HTTP $status (expected 401)."
              return 0
            fi
            if ! grep -Eiq '^cache-control:.*no-store' "$headers"; then
              record_failure "$route must set Cache-Control: no-store."
              return 0
            fi
            echo "PASS $route: unauthenticated request rejected with 401 and no-store."
          }

          check_unauthenticated_api "/api/cases"
          check_unauthenticated_api "/api/findings"
          check_unauthenticated_api "/api/reports"

          if ! api_status="$(curl --silent --show-error --max-time 20 --output "$body" --dump-header "$headers" --write-out '%{http_code}' "$base/api/analyze")"; then
            record_failure "GET /api/analyze request failed."
          elif [[ "$api_status" != "405" ]]; then
            record_failure "GET /api/analyze returned HTTP $api_status (expected 405)."
          elif ! grep -Eiq '^cache-control:.*no-store' "$headers"; then
            record_failure "GET /api/analyze must set Cache-Control: no-store."
          else
            echo "PASS /api/analyze: unsupported GET rejected with 405 and no-store."
          fi

          # Health is a public-safe configuration snapshot, not a claim of live dependency readiness.
          rate_mode="unknown"
          shared_limiter_ok="false"
          if ! health_status="$(curl --silent --show-error --max-time 20 --output "$body" --write-out '%{http_code}' "$base/api/health")"; then
            record_failure "Production /api/health request failed."
          elif [[ "$health_status" != "200" ]]; then
            record_failure "Production /api/health returned HTTP $health_status (expected 200)."
          elif ! jq -e '.status == "configuration-only" and (.checks.rateLimit.configured | type == "boolean") and (.checks.rateLimit.sharedAcrossInstances | type == "boolean") and (has("UPSTASH_REDIS_REST_TOKEN") | not)' "$body" >/dev/null; then
            record_failure "Production /api/health returned an invalid or unsafe configuration snapshot."
          else
            rate_mode="$(jq -r '.checks.rateLimit.mode // empty' "$body")"
            shared_limiter_ok="$(jq -r '.checks.rateLimit.sharedAcrossInstances // false' "$body")"
            echo "Production health: rate limiter mode=$rate_mode sharedAcrossInstances=$shared_limiter_ok."
          fi

          # Exercise a harmless synthetic input. Missing shared limiting must fail closed,
          # but it remains a release blocker because the primary analysis feature is unavailable.
          if ! analysis_status="$(curl --silent --show-error --max-time 20 --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
            -X POST "$base/api/analyze" -H 'Content-Type: application/json' \
            --data '{"input":"Synthetic release smoke test: an ordinary internal status update."}')"; then
            record_failure "Synthetic POST /api/analyze request failed."
          elif [[ "$rate_mode" == "shared-upstash" && "$shared_limiter_ok" == "true" ]]; then
            if [[ "$analysis_status" != "200" ]]; then
              record_failure "Configured shared limiter did not allow the synthetic analysis smoke test (HTTP $analysis_status)."
            elif ! jq -e 'has("threat_category") and has("summary") and has("notice") and (.summary | length > 0)' "$body" >/dev/null; then
              record_failure "Synthetic analysis response did not contain the required structured fields."
            else
              echo "PASS /api/analyze: synthetic request returned a structured local analysis result."
            fi
          else
            if [[ "$analysis_status" != "503" ]]; then
              record_failure "Analysis must fail closed when shared rate limiting is absent; received HTTP $analysis_status."
            fi
            if ! grep -Eiq '^retry-after:' "$headers"; then
              record_failure "Fail-closed /api/analyze response must include Retry-After."
            fi
            record_failure "Production release is degraded: shared rate limiting is not configured (mode=$rate_mode); analysis returned HTTP $analysis_status."
          fi

          if ! version_status="$(curl --silent --show-error --max-time 20 --output "$body" --write-out '%{http_code}' "$base/api/version")"; then
            record_failure "Production /api/version request failed; the deployed build revision cannot be verified."
          elif [[ "$version_status" != "200" ]]; then
            record_failure "Production /api/version returned HTTP $version_status; the deployed build revision cannot be verified."
          elif ! deployed_sha="$(jq -r '.commit // empty' "$body")"; then
            record_failure "Production /api/version returned invalid JSON."
          elif [[ "$deployed_sha" != "$expected_sha" ]]; then
            record_failure "Production is serving commit $deployed_sha, but current main is $expected_sha. Deployment is stale."
          else
            echo "PASS /api/version: production serves current main commit $expected_sha."
          fi

          if [[ "$failures" -gt 0 ]]; then
            echo "::error::Production smoke completed with $failures release-gate failure(s)."
            exit 1
          fi
          echo "PASS production release smoke: all route, API, limiter and revision gates passed."
