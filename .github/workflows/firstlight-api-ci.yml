name: FIRSTLIGHT API CI

on:
  pull_request:
    paths:
      - "scripts/check_no_supabase_runtime.py"
      - "scripts/satark_backup.py"
      - "tests/test_satark_backup.py"
      - "satark_backend.py"
      - "alembic.ini"
      - "migrations/**"
      - "tests/test_satark_backend.py"
      - "tests/test_satark_postgres.py"
      - "tests/test_satark_migrations.py"
      - "firstlight_engine.py"
      - "firstlight_rules.py"
      - "firstlight_api.py"
      - "firstlight_agents.py"
      - "ai_provider.py"
      - "firstlight_wazuh.py"
      - "tests/test_firstlight_wazuh_worker.py"
      - "firstlight_wazuh_worker.py"
      - "firstlight_investigation_worker.py"
      - "Dockerfile.firstlight-investigation-worker"
      - "docker-compose.local.yml"
      - "tests/test_firstlight_investigation_worker.py"
      - "firstlight_response_executor.py"
      - "tests/test_firstlight_response_executor.py"
      - "tests/test_ai_provider.py"
      - "docs/FIRSTLIGHT_RESPONSE_EXECUTOR.md"
      - "web/src/app/api/firstlight/jobs/route.ts"
      - "web/src/app/api/[...path]/route.ts"
      - "web/src/lib/satark-api-proxy.ts"
      - "web/next.config.ts"
      - "web/Dockerfile"
      - "firstlight-api-requirements.txt"
      - "Dockerfile.firstlight-api"
      - "Dockerfile.firstlight-worker"
      - "tests/test_firstlight_api.py"
      - "tests/test_firstlight_agents.py"
      - "tests/test_firstlight_api_details.py"
      - "tests/test_firstlight_wazuh.py"
      - "tests/test_firstlight_wazuh_investigation_api.py"
      - "scripts/accept_firstlight_wazuh_live.py"
      - "tests/test_firstlight_wazuh_live_acceptance.py"
      - "scripts/accept_firstlight_worker_live.py"
      - "tests/test_firstlight_worker_live_acceptance.py"
      - "docs/TRACK_1_COMPLETION_PLAN.md"
      - "tests/test_firstlight_engine.py"
      - "tests/test_firstlight_rules.py"
      - ".github/workflows/firstlight-api-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/check_no_supabase_runtime.py"
      - "satark_backend.py"
      - "alembic.ini"
      - "migrations/**"
      - "tests/test_satark_backend.py"
      - "tests/test_satark_postgres.py"
      - "firstlight_engine.py"
      - "firstlight_api.py"
      - "firstlight_agents.py"
      - "ai_provider.py"
      - "firstlight_wazuh.py"
      - "tests/test_firstlight_wazuh_worker.py"
      - "Dockerfile.firstlight-worker"
      - "firstlight_wazuh_worker.py"
      - "firstlight_investigation_worker.py"
      - "Dockerfile.firstlight-investigation-worker"
      - "docker-compose.local.yml"
      - "tests/test_firstlight_investigation_worker.py"
      - "firstlight_response_executor.py"
      - "tests/test_firstlight_response_executor.py"
      - "docs/FIRSTLIGHT_RESPONSE_EXECUTOR.md"
      - "web/src/app/api/firstlight/jobs/route.ts"
      - "web/src/app/api/[...path]/route.ts"
      - "web/src/lib/satark-api-proxy.ts"
      - "web/next.config.ts"
      - "web/Dockerfile"
      - "firstlight-api-requirements.txt"
      - "Dockerfile.firstlight-api"
      - "tests/test_firstlight_api.py"
      - "tests/test_firstlight_api_details.py"
      - "tests/test_firstlight_agents.py"
      - "tests/test_firstlight_wazuh.py"
      - "scripts/accept_firstlight_wazuh_live.py"
      - "tests/test_firstlight_wazuh_live_acceptance.py"
      - "scripts/accept_firstlight_worker_live.py"
      - "tests/test_firstlight_worker_live_acceptance.py"
      - "docs/TRACK_1_COMPLETION_PLAN.md"
      - "tests/test_firstlight_engine.py"
      - ".github/workflows/firstlight-api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: satark
          POSTGRES_PASSWORD: satark
          POSTGRES_DB: satark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satark -d satark_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: firstlight-api-requirements.txt
      - name: Install API dependencies and test runner
        run: python -m pip install -r firstlight-api-requirements.txt pytest
      - name: Run shared API and engine tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          SATARK_TEST_POSTGRES_URL: postgresql+psycopg://satark:satark@localhost:5432/satark_test
        run: python -m pytest -q tests/test_satark_migrations.py tests/test_satark_postgres.py tests/test_satark_backend.py tests/test_firstlight_api.py tests/test_firstlight_api_details.py tests/test_firstlight_engine.py tests/test_firstlight_agents.py tests/test_firstlight_wazuh.py tests/test_firstlight_wazuh_worker.py tests/test_firstlight_wazuh_investigation_api.py tests/test_firstlight_wazuh_live_acceptance.py tests/test_firstlight_worker_live_acceptance.py tests/test_firstlight_rules.py tests/test_firstlight_investigation_worker.py tests/test_firstlight_response_executor.py tests/test_ai_provider.py

      - name: Verify no Supabase runtime dependency remains
        run: python scripts/check_no_supabase_runtime.py
      - name: Validate self-hosted Compose stack
        run: docker compose -f docker-compose.local.yml config --quiet
      - name: Build FIRSTLIGHT API and worker images
        run: |
          docker build -f Dockerfile.firstlight-api -t firstlight-api:ci .
          docker build -f Dockerfile.firstlight-worker -t firstlight-worker:ci .
          docker build -f Dockerfile.firstlight-investigation-worker -t firstlight-investigation-worker:ci .
      - name: Smoke-test runtime imports inside built images
        run: |
          docker run --rm --entrypoint python firstlight-api:ci -c "import firstlight_api, firstlight_engine, firstlight_rules, firstlight_agents, ai_provider"
          docker run --rm --entrypoint python firstlight-worker:ci -c "import firstlight_wazuh_worker, firstlight_engine, firstlight_rules"
          docker run --rm --entrypoint python firstlight-investigation-worker:ci -c "import firstlight_investigation_worker, firstlight_engine, firstlight_rules, firstlight_wazuh_worker"
