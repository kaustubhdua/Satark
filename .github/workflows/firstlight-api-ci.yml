name: FIRSTLIGHT API CI

on:
  push:
    paths:
      - "firstlight_api.py"
      - "firstlight_response_api.py"
      - "firstlight_response_executor.py"
      - "firstlight_engine.py"
      - "firstlight_rules.py"
      - "firstlight_agents.py"
      - "ai_provider.py"
      - "firstlight_ingest.py"
      - "firstlight_wazuh.py"
      - "firstlight_wazuh_worker.py"
      - "firstlight_investigation_worker.py"
      - "firstlight_response_executor.py"
      - "integrations/**"
      - "satark_backend.py"
      - "migrations/**"
      - "tests/test_firstlight*.py"
      - "scripts/postgres_backup_restore_drill.py"
      - "scripts/bootstrap_wazuh_lab.sh"
      - "tests/test_satark_backend.py"
      - "tests/test_satark_migrations.py"
      - "tests/test_satark_postgres.py"
      - "tests/test_satark_backup.py"
      - "scripts/check_no_supabase_runtime.py"
      - "scripts/satark_backup.py"
      - "scripts/check_no_microsoft_runtime.py"
      - "firstlight-api-requirements.txt"
      - "Dockerfile.firstlight-api"
      - "Dockerfile.firstlight-worker"
      - "Dockerfile.firstlight-investigation-worker"
      - "docker-compose.local.yml"
      - "docker-compose.production.yml"
      - "deploy/Caddyfile"
      - "deploy/production.env.example"
      - "deploy/postgres-init/**"
      - ".github/workflows/firstlight-api-ci.yml"
      - "release-gate/EXACT_SHA.md"
  pull_request:
    paths:
      - "firstlight_api.py"
      - "firstlight_response_api.py"
      - "firstlight_response_executor.py"
      - "firstlight_engine.py"
      - "firstlight_rules.py"
      - "firstlight_agents.py"
      - "firstlight_ingest.py"
      - "firstlight_wazuh.py"
      - "firstlight_wazuh_worker.py"
      - "firstlight_investigation_worker.py"
      - "integrations/**"
      - "satark_backend.py"
      - "migrations/**"
      - "tests/test_firstlight*.py"
      - "tests/test_satark_backend.py"
      - "tests/test_satark_migrations.py"
      - "tests/test_satark_postgres.py"
      - "tests/test_satark_backup.py"
      - "scripts/check_no_supabase_runtime.py"
      - "scripts/satark_backup.py"
      - "firstlight-api-requirements.txt"
      - "Dockerfile.firstlight-api"
      - "Dockerfile.firstlight-worker"
      - "Dockerfile.firstlight-investigation-worker"
      - "docker-compose.local.yml"
      - ".github/workflows/firstlight-api-ci.yml"
      - "release-gate/EXACT_SHA.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firstlight-api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: FIRSTLIGHT regression, PostgreSQL and container validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: satark
          POSTGRES_PASSWORD: satark
          POSTGRES_DB: satark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satark -d satark_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: firstlight-api-requirements.txt

      - name: Install PostgreSQL client for backup and restore integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Install API dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r firstlight-api-requirements.txt pytest

      - name: Compile FIRSTLIGHT and SATARK backend modules
        run: |
          python -m compileall -q firstlight_api.py firstlight_response_api.py firstlight_response_executor.py firstlight_engine.py firstlight_rules.py firstlight_agents.py firstlight_ingest.py firstlight_wazuh.py firstlight_wazuh_worker.py firstlight_investigation_worker.py satark_backend.py integrations scripts

      - name: Run FIRSTLIGHT engine, API, response and worker tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          SATARK_TEST_POSTGRES_URL: postgresql+psycopg://satark:satark@localhost:5432/satark_test
        run: |
          python -m pytest -q \
            tests/test_firstlight_api.py \
            tests/test_firstlight_api_details.py \
            tests/test_firstlight_engine.py \
            tests/test_firstlight_agents.py \
            tests/test_firstlight_ingest.py \
            tests/test_firstlight_rules.py \
            tests/test_firstlight_wazuh.py \
            tests/test_firstlight_wazuh_worker.py \
            tests/test_firstlight_wazuh_investigation_api.py \
            tests/test_firstlight_investigation_worker.py \
            tests/test_firstlight_response_executor.py \
            tests/test_firstlight_response_api.py \
            tests/test_firstlight_wazuh_response_actions.py \
            tests/test_firstlight_live_response_cli.py \
            tests/test_firstlight_live_wazuh_investigation.py \
            tests/test_firstlight_wazuh_live_acceptance.py \
            tests/test_firstlight_worker_live_acceptance.py \
            tests/test_satark_backend.py \
            tests/test_satark_migrations.py \
            tests/test_satark_backup.py \
            tests/test_satark_postgres.py

      - name: Perform isolated PostgreSQL backup and restore drill
        env:
          SATARK_TEST_POSTGRES_URL: postgresql+psycopg://satark:satark@localhost:5432/satark_test
          RUNNER_TEMP: ${{ runner.temp }}
        run: python scripts/postgres_backup_restore_drill.py

      - name: Enforce Supabase-free application runtime
        run: python scripts/check_no_supabase_runtime.py

      - name: Enforce Microsoft-free runtime provider boundary
        run: python scripts/check_no_microsoft_runtime.py

      - name: Validate Wazuh lab bootstrap shell
        run: bash -n scripts/bootstrap_wazuh_lab.sh

      - name: Validate PostgreSQL role bootstrap shell
        run: sh -n deploy/postgres-init/01-create-roles.sh

      - name: Validate local self-hosted Compose configuration
        run: docker compose -f docker-compose.local.yml config --quiet

      - name: Validate production PostgreSQL and TLS Compose stack
        env:
          POSTGRES_PASSWORD: test-only-admin-password
          SATARK_RUNTIME_DB_PASSWORD: test-only-runtime-password
          SATARK_BACKUP_DB_PASSWORD: test-only-backup-password
          SATARK_DATABASE_URL: postgresql+psycopg://satark_runtime:test-only-runtime-password@db:5432/satark
          SATARK_BACKUP_DATABASE_URL: postgresql+psycopg://satark_backup:test-only-backup-password@db:5432/satark
          SATARK_DOMAIN: satark.example.test
          ACME_EMAIL: ci@example.test
          SATARK_MFA_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          SATARK_SMTP_HOST: smtp.example.test
          SATARK_SMTP_USERNAME: ci
          SATARK_SMTP_PASSWORD: test-only
          SATARK_SMTP_FROM: SATARK <ci@example.test>
          FIRSTLIGHT_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRSTLIGHT_WAZUH_SYNC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRSTLIGHT_WAZUH_INDEXER_URL: https://wazuh-indexer.example.test:9200
          FIRSTLIGHT_WAZUH_INDEXER_USERNAME: ci
          FIRSTLIGHT_WAZUH_INDEXER_PASSWORD: test-only
          FIRSTLIGHT_WAZUH_ALLOWED_AGENT_IDS: "001"
          FIRSTLIGHT_WAZUH_TENANT_ID: 00000000-0000-4000-8000-000000000001
          FIRSTLIGHT_WAZUH_CASE_ID: 00000000-0000-4000-8000-000000000002
          FIRSTLIGHT_WAZUH_ACTOR_ID: 00000000-0000-4000-8000-000000000003
        run: |
          sh -n deploy/postgres-init/01-create-roles.sh
          docker compose -f docker-compose.production.yml config --quiet

      - name: Build API and worker images
        run: |
          docker build -f Dockerfile.firstlight-api -t satark-firstlight-api:ci .
          docker build -f Dockerfile.firstlight-worker -t satark-firstlight-worker:ci .
          docker build -f Dockerfile.firstlight-investigation-worker -t satark-firstlight-investigation-worker:ci .

      - name: Smoke-test API and worker imports
        run: |
          docker run --rm --entrypoint python satark-firstlight-api:ci -c "import firstlight_api, firstlight_response_api, firstlight_response_executor, firstlight_engine, firstlight_rules, firstlight_agents, firstlight_wazuh, satark_backend, integrations.response_actions"
          docker run --rm --entrypoint python satark-firstlight-worker:ci -c "import firstlight_wazuh_worker, firstlight_engine, firstlight_rules"
          docker run --rm --entrypoint python satark-firstlight-investigation-worker:ci -c "import firstlight_investigation_worker, firstlight_engine, firstlight_rules, firstlight_agents, ai_provider, satark_backend"
