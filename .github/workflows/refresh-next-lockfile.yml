name: Refresh patched Next.js lockfile

on:
  push:
    branches:
      - remove-supabase-runtime-dependency
    paths:
      - web/package.json

permissions:
  contents: write

concurrency:
  group: refresh-next-lockfile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-supabase-runtime-dependency
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Regenerate lockfile with npm
        run: npm install --prefix web --package-lock-only --ignore-scripts
      - name: Verify exact installed version
        run: |
          npm ci --prefix web --ignore-scripts
          npm ls --prefix web next --depth=0
          node -e "const p=require('./web/package-lock.json'); if(p.packages['node_modules/next'].version !== '15.5.29') process.exit(1)"
      - name: Commit npm-generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json"
          else
            git commit -m "security: refresh patched Next.js lockfile"
            git push origin HEAD:remove-supabase-runtime-dependency
          fi
