name: Android File Guard
on:
  push:
    paths:
      - "web/**"
      - "styles.css"
      - ".streamlit/config.toml"
      - "firstlight_api.py"
      - "satark_backend.py"
      - "integrations/**"
      - "migrations/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/firstlight-api-ci.yml"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/release-gate.yml"
      - "docs/RELEASE_READINESS.md"
      - "docs/FIRSTLIGHT_IMPLEMENTATION_STATUS.md"
      - "android/**"
      - "file_guard/**"
      - "scripts/check_no_supabase_runtime.py"
      - "scripts/evaluate_file_guard.py"
      - "tests/test_file_guard.py"
      - "tests/test_file_guard_structure.py"
      - "tests/test_file_guard_reports_and_evaluation.py"
      - "tests/test_android_offline_contract.py"
      - "tests/test_android_bridge.py"
      - "tests/test_ember_import.py"
      - "tests/test_ember_download.py"
      - "scripts/import_ember2024.py"
      - "scripts/download_ember2024.py"
      - "scripts/build_ember2024_android_db.py"
      - "scripts/android_emulator_smoke.py"
      - "tests/test_android_emulator_smoke.py"
      - "tests/test_android*.py"
      - "tests/test_ember_android_db.py"
      - ".github/workflows/android-file-guard.yml"
      - "release-gate/EXACT_SHA.md"
  pull_request:
    paths:
      - "web/**"
      - "firstlight_api.py"
      - "satark_backend.py"
      - "integrations/**"
      - "migrations/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/firstlight-api-ci.yml"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/release-gate.yml"
      - "docs/RELEASE_READINESS.md"
      - "docs/FIRSTLIGHT_IMPLEMENTATION_STATUS.md"
      - "android/**"
      - "file_guard/**"
      - "scripts/check_no_supabase_runtime.py"
      - "scripts/evaluate_file_guard.py"
      - "tests/test_file_guard.py"
      - "tests/test_file_guard_structure.py"
      - "tests/test_file_guard_reports_and_evaluation.py"
      - "tests/test_android_offline_contract.py"
      - "tests/test_android_bridge.py"
      - "scripts/import_ember2024.py"
      - "scripts/download_ember2024.py"
      - "scripts/build_ember2024_android_db.py"
      - "scripts/android_emulator_smoke.py"
      - "tests/test_android_emulator_smoke.py"
      - "tests/test_android*.py"
      - "tests/test_ember_import.py"
      - "tests/test_ember_download.py"
      - "tests/test_ember_android_db.py"
      - ".github/workflows/android-file-guard.yml"
      - "release-gate/EXACT_SHA.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-file-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-engine:
    name: Offline Python engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Android Python engine stays in sync with desktop engine
        run: |
          cmp file_guard/agents.py android/app/src/main/python/file_guard/agents.py
          cmp file_guard/__init__.py android/app/src/main/python/file_guard/__init__.py
          cmp file_guard/engine.py android/app/src/main/python/file_guard/engine.py
          cmp file_guard/intelligence.py android/app/src/main/python/file_guard/intelligence.py
          cmp file_guard/history.py android/app/src/main/python/file_guard/history.py
          cmp file_guard/report.py android/app/src/main/python/file_guard/report.py
          cmp file_guard/structure.py android/app/src/main/python/file_guard/structure.py
      - name: Install optional desktop YARA test dependency
        run: "python -m pip install --only-binary=:all: -r requirements-yara.txt"
      - name: Compile File Guard and evaluation tools
        run: python -m compileall -q file_guard android/app/src/main/python scripts/evaluate_file_guard.py
      - name: Run deterministic File Guard tests
        run: python -m unittest discover -s tests -p "test_file_guard.py" -v
      - name: Test Android emulator foreground-activity recognition
        run: python -m unittest discover -s tests -p "test_android_emulator_smoke.py" -v
      - name: Run PE, ELF and DEX structural tests
        run: python -m unittest discover -s tests -p "test_file_guard_structure.py" -v
      - name: Run evidence report and evaluation tests
        run: python -m unittest discover -s tests -p "test_file_guard_reports_and_evaluation.py" -v
      - name: Enforce Android offline and permission contract
        run: python -m unittest discover -s tests -p "test_android_offline_contract.py" -v
      - name: Exercise the exact Android Python bridge
        run: python -m unittest discover -s tests -p "test_android_bridge.py" -v
      - name: Verify Supabase is absent from all application runtime source
        run: python scripts/check_no_supabase_runtime.py
      - name: Run EMBER2024 converter tests
        run: python -m unittest discover -s tests -p "test_ember_import.py" -v
      - name: Run EMBER2024 downloader tests
        run: python -m unittest discover -s tests -p "test_ember_download.py" -v
      - name: Run EMBER2024 Android starter database tests
        run: python -m unittest discover -s tests -p "test_ember_android_db.py" -v
      - name: Set up Chaquopy-compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install optional YARA test dependency for Python 3.13
        run: "python -m pip install --only-binary=:all: -r requirements-yara.txt"
      - name: Re-run Android Python bridge and report tests on Python 3.13
        run: |
          python -m compileall -q file_guard android/app/src/main/python scripts/evaluate_file_guard.py
          python -m unittest discover -s tests -p "test_file_guard*.py" -v
          python -m unittest discover -s tests -p "test_android_bridge.py" -v
          python -m unittest discover -s tests -p "test_android_offline_contract.py" -v

  android-build:
    name: Build native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore pinned EMBER2024 starter database cache
        id: ember-db-cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/satark/ember2024-starter.sqlite3
            .cache/satark/ember2024-starter.json
          key: satark-ember2024-8cc201a3d2a1cb2957123eb5ad996d5a3178bbcc-apk-train-v2
      - name: Build pinned EMBER2024 APK starter database
        if: steps.ember-db-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .cache/satark
          python scripts/download_ember2024.py --output-dir .cache/satark/ember2024 --split train --file-type APK --max-download-gb 2 --max-extracted-gb 4
          python scripts/import_ember2024.py --input-dir .cache/satark/ember2024 --output-dir .cache/satark/ember2024-csv --split train --file-type APK --rows-per-part 25000
          python scripts/build_ember2024_android_db.py --input-dir .cache/satark/ember2024 --csv-dir .cache/satark/ember2024-csv --output-db .cache/satark/ember2024-starter.sqlite3 --split train --file-type APK
          rm -rf .cache/satark/ember2024 .cache/satark/ember2024-csv
      - name: Package verified historical starter database into offline app
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          test -s .cache/satark/ember2024-starter.sqlite3
          test -s .cache/satark/ember2024-starter.json
          cp .cache/satark/ember2024-starter.sqlite3 android/app/src/main/assets/ember2024-starter.sqlite3
          cp .cache/satark/ember2024-starter.json android/app/src/main/assets/ember2024-starter.json
      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify Android privacy and integration boundaries
        run: |
          ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.SEND' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.SEND_MULTIPLE' android/app/src/main/AndroidManifest.xml
          grep -q 'ACTION_OPEN_DOCUMENT_TREE' android/app/src/main/java/com/satark/mobile/MainActivity.kt
          grep -q 'scan_shared_file_path' android/app/src/main/python/android_bridge.py
          grep -q 'expected_sha256' android/app/src/main/python/android_bridge.py
          grep -q 'checksum_verified' android/app/src/main/python/android_bridge.py
          grep -q 'manifest' android/app/src/main/java/com/satark/mobile/MainActivity.kt
          grep -q 'copyUriToTemp' android/app/src/main/java/com/satark/mobile/MainActivity.kt
          grep -q 'copyUriToTemp' android/app/src/main/java/com/satark/mobile/FolderScanWorker.kt
          grep -q 'PeriodicWorkRequestBuilder' android/app/src/main/java/com/satark/mobile/MainActivity.kt
          test -s android/app/src/main/assets/ember2024-starter.sqlite3
          test -s android/app/src/main/assets/ember2024-starter.json
      - name: Compile Android app
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: satark-file-guard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build unsigned release APK and Android App Bundle
        run: gradle -p android :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
      - name: Upload unsigned release outputs
        uses: actions/upload-artifact@v4
        with:
          name: satark-file-guard-release-unsigned
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  android-emulator-smoke:
    name: Install and launch APK on Android emulator
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact APK built above
        uses: actions/download-artifact@v4
        with:
          name: satark-file-guard-debug-apk
          path: artifacts/apk
      - name: Boot Android 15 emulator and smoke-test the app
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -cores 2 -memory 4096
          disable-animations: true
          script: |
            set -eu
            mkdir -p artifacts
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            # Let Android's system UI, package manager and permission controller settle
            # before measuring the first app launch on a CPU-constrained CI runner.
            sleep 30
            adb install -r artifacts/apk/app-debug.apk
            python3 scripts/android_emulator_smoke.py --artifact-dir artifacts

      - name: Upload Android emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satark-android-emulator-diagnostics
          path: |
            artifacts/satark-emulator-logcat.txt
            artifacts/satark-screen.png
            artifacts/satark-window.xml
          if-no-files-found: ignore
          retention-days: 7
