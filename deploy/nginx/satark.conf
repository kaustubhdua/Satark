# Included from nginx.conf's http context (conf.d/*.conf).
# The default is to trust the direct TCP peer only. If a load balancer sits in
# front, configure set_real_ip_from for its exact CIDRs before relying on
# per-client limits; never trust arbitrary client-supplied X-Forwarded-For.
limit_req_zone $binary_remote_addr zone=satark_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=satark_api:20m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=satark_connections:10m;

server {
    listen 8080;
    server_name _;

    client_max_body_size 8m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn satark_connections 20;

    # Docker embedded DNS. The variable form defers service-name resolution
    # until request time, allowing nginx -t to validate this file standalone.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $satark_web web:3000;

    location ~ ^/api/auth/(login|signup|password-reset/request|email-verification/request|mfa/enroll/start|mfa/enroll/confirm)$ {
        limit_req zone=satark_auth burst=10 nodelay;
        proxy_pass http://$satark_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location = /api/workspaces/invitations {
        limit_req zone=satark_auth burst=10 nodelay;
        proxy_pass http://$satark_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location ^~ /api/ {
        limit_req zone=satark_api burst=120 nodelay;
        proxy_pass http://$satark_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://$satark_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
